<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlas</title>

    <!-- estilo del mapa-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="../css/mapa.css">
</head>

<body>
    <div class="caja">
        <div class="encabezado">
            <h1>Charlas de orientacion electoral</h1>

        </div>

        <div class="barra-buscador">
            <!-- Buscador de la charla-->
            <input id="buscador" type="text" placeholder="Busca por nombre o direccion">
            <h2>Charlas disponibles</h2>
        </div>

        <div class="lista-mapa">
            <!--aqui JS agregara las charlas -->
            <div id="lista-charlas"></div>

            <div id="map"></div>
        </div>




    </div>
    <script src="../javascript/charla.js"></script>
</body>

</html>
