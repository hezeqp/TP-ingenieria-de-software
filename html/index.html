<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Portal para Autoridades de Mesa</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header class="titulo">
        <img src="../imagenes/postulantes autoridad de mesa.png"
             alt="Autoridades de mesa">

        <img src="../imagenes/logo_cne.jpg"
             alt="Cámara Nacional Electoral">
    </header>

    <main>
        <div class="parrafos">
            <h1>PORTAL PARA AUTORIDADES DE MESA</h1>
            <p>Elecciones Nacionales 2026</p>
        </div>

        <div class="logo-principal">
            <img src="../imagenes/principal.png"
                 alt="Imagen principal del portal">
        </div>

        <div class="botones">
            <button class="botones_registrate">Registrate</button>
            <button class="botones_charla">Charlas</button>
        </div>
    </main>

</body>
</html>
